# Generated from:
# https://github.com/plone/meta/tree/2.x/src/plone/meta/default
# See the inline comments on how to expand/tweak this configuration file
[meta]
template = "default"
commit-id = "2.12.0"

[gitignore]
extra_lines = """
.venv
htmlcov/
.mxdev_cache/
requirements.txt
"""

[pyproject]
# plone.classicui: classic distribution for the dev instance (scripts/create_site.py)
# plone.formwidget.datetime: only imported on Plone 4 (HAS_PLONE_5_AND_MORE fallback)
dependencies_ignores = "['plone.classicui', 'plone.formwidget.datetime']"
check_manifest_ignores = """
    ".gitattributes",
    "Makefile",
    "instance.yaml",
    "scripts/*",
"""

[tox]
# Compile the locales/*.po files: utils._() needs the translation domain, and
# the .mo files are not tracked (the old buildout [testenv] set the same).
test_environment_variables = """
    zope_i18n_compile_mo_files=true
"""
test_matrix = {"6.2" = ["3.14", "3.13", "3.12", "3.11", "3.10"], "6.1" = ["3.13", "3.12", "3.11", "3.10"]}
constraints_files = {"6.2" = "https://dist.plone.org/release/6.2.3/constraints.txt", "6.1" = "https://dist.plone.org/release/6.1-latest/constraints.txt"}
